syntax = "proto3";

package databaze;

option go_package = "github.com/555tv/databaze/proto_contracts";

service UserService {
    rpc GetUser(GetUserRequest) returns (User);
}

message GetUserRequest {
    string id = 1;
}

message User {
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string email = 4;
}