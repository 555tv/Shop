syntax = "proto3";

package databaze;

option go_package = "github.com/555tv/databaze/proto_contracts";

service ProductService {
    rpc GetProduct(GetProductRequest) returns (Product);
}

message GetProductRequest {
    string id = 1;
}

message Product {
    string id = 1;
    string name = 2;
    double price = 3;
}